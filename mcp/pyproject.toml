[project]
name = "nook-mcp"
version = "0.1.0"
description = "Custom MCP server for the PyData London 2026 OpenTelemetry workshop"
requires-python = ">=3.12"
dependencies = [
  "fastmcp==3.2.3",
  "aiokafka>=0.11.0,<0.13",
  "httpx>=0.27,<1",
  "opentelemetry-api>=1.27,<2",
  "opentelemetry-sdk>=1.27,<2",
  "opentelemetry-exporter-otlp-proto-http>=1.27,<2",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/nook_mcp"]
