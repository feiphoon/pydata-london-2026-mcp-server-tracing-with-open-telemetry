# OpenTelemetry Collector configuration for the workshop.
#
# Pipeline shape:
#
#   nook-mcp ──OTLP──▶ otel-collector ──OTLP──▶ jaeger
#                              │
#                              └─ debug exporter (stdout, for teaching §6)
#
# The collector is where attendees will add sampling, redaction
# and other production-pattern processors in section 6.

receivers:
  otlp:
    protocols:
      grpc:
        endpoint: 0.0.0.0:4317
      http:
        endpoint: 0.0.0.0:4318

processors:
  batch:
    timeout: 1s

exporters:
  otlp/jaeger:
    endpoint: jaeger:4317
    tls:
      insecure: true
  debug:
    verbosity: normal

service:
  pipelines:
    traces:
      receivers: [otlp]
      processors: [batch]
      exporters: [otlp/jaeger, debug]
